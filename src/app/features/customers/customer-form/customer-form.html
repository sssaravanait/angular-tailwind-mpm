<div class="gap-3 p-4 bg-olive-50 dark:bg-blue-200 rounded-lg shadow-md">
    <div class="justify-center">

        <h2 class="text-2xl font-bold text-center mb-4">Customer Details</h2>

        <form action="" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 p-3 max-w-4xl mx-auto">
            <!-- Row 1: Title, Name -->
            <div class="flex flex-col">
                <label pLabel for="title" class="mb-1">Title</label>
                <input pInputText id="title" type="text" class="w-full" />
            </div>
            <div class="flex flex-col">
                <label pLabel for="name" class="mb-1">Name</label>
                <input pInputText id="name" type="text" class="w-full" />
            </div>

            <!-- Row 2: Surname, Birthday -->
            <div class="flex flex-col">
                <label pLabel for="surname" class="mb-1">Surname</label>
                <input pInputText id="surname" type="text" class="w-full" />
            </div>
            <div class="flex flex-col">
                <label pLabel for="birthday" class="mb-1">Birthday</label>
                <p-datepicker [(ngModel)]="customer.birth_date" dateFormat="dd/mm/yy" placeholder="dd/mm/yyyy" pInputMask="99/99/9999" [keepCharPositions]="true" />
            </div>

            <!-- Row 3: Gender, Education -->
            <div class="flex flex-col">
                <label pLabel for="gender" class="mb-1">Gender</label>
                <p-select [options]="genders" [(ngModel)]="customer.gender" optionLabel="label" optionValue="value" placeholder="Select a gender" class="w-full" />

            </div>
            <div class="flex flex-col">
                <label pLabel for="education" class="mb-1">Education</label>
                <input pInputText id="education" type="text" class="w-full" />
            </div>

            <!-- Row 4: Email, Phone -->
            <div class="flex flex-col">
                <label pLabel for="email" class="mb-1">Email</label>
                <input pInputText id="email" type="text" class="w-full" />
            </div>
            <div class="flex flex-col">
                <label pLabel for="phone" class="mb-1">Phone</label>
                <!-- For phone, p-inputMask is good, but ensure it's imported and bound -->
                <input pInputText id="phone" type="text" class="w-full" />
            </div>

            <!-- Row 5: City, Street -->
            <div class="flex flex-col">
                <label pLabel for="city" class="mb-1">City</label>
                <p-select [options]="cities" [(ngModel)]="customer.city" optionLabel="label" optionValue="id" placeholder="Select a city" class="w-full" />
            </div>
            <div class="flex flex-col">
                <label pLabel for="street" class="mb-1">Street</label>
                <input pInputText id="street" type="text" class="w-full" />
            </div>

            <!-- Form Actions: Submit and Cancel Buttons -->
            <!-- These buttons span across both columns and are aligned to the right -->
            <div class="col-span-full flex justify-end gap-3 mt-4">
                <button pButton type="button" icon="pi pi-times" class="p-button-secondary">Cancel</button>
                <button pButton type="submit" icon="pi pi-check">Submit</button>
            </div>
        </form>
    </div>
</div>
